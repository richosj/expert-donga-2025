<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width:1580px" />
  <meta name="description" content="동아쏘시오그룹 2025">
  <title>동아쏘시오그룹 2025</title>
  <link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov-dynamic-subset.min.css" />
  <link rel="stylesheet" href="./assets/css/index.css">

<body>
 
  <main id="app" class="layout-sub2">

<section>

        <h2 class="section-title">비밀번호 변경</h2>
        
        <div class="password-form">

                <label>기존 비밀번호</label>
                <div><input type="password" class="password-input" placeholder="비밀번호를 입력하세요"></div>

            <div class="form-group">
                <label>신규 비밀번호</label>

                <div><input type="password" class="password-input" placeholder="비밀번호를 다시 입력하세요"></div>
            </div>
            <button class="change-btn">비밀번호 변경</button>
        </div>
    </div>
    </section>
  </main>
  <script type="module" src="/js/main.js"></script>
